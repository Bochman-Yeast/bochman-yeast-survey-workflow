# Two conda environments were used across this pipeline, on Indiana
# University's Quartz HPC cluster. Versions below are confirmed directly
# from `conda list` in each environment during this analysis (not assumed) -
# see the main README for how each was cross-checked.
#
# ============================================================
# Environment 1: yeast-id
# (reference prep, alignment, joint-calling, filtering, own-strain calling)
# ============================================================
# name: yeast-id
# channels:
#   - bioconda
#   - conda-forge
# dependencies:
#   - bwa-mem2=2.3
#   - samtools=1.23.1
#   - bcftools=1.23.1
#   - htslib=1.23.1
#   - minimap2=2.31
#   - clair3=2.0.2
#
# ============================================================
# Environment 2: popgen
# (PLINK conversion, ADMIXTURE, PCA, BIONJ tree - R-based steps)
# ============================================================
# name: popgen
# channels:
#   - bioconda
#   - conda-forge
# dependencies:
#   - plink=1.90b7.7        # reports itself as "PLINK v1.9.0-b.8" at runtime -
#                            # same install, PLINK 1.9's version string and its
#                            # bioconda package tag differ slightly, as usual
#   - admixture=1.3.0
#   - r-base=4.3.3
#   - bioconductor-snprelate=1.36.0
#   - bioconductor-gdsfmt=1.38.0
#   - r-ape=5.8_1
#   - bioconductor-ggtree=3.10.0
#   - r-ggplot2=3.5.2
#
# ============================================================
# Notably NOT confirmed / gaps
# ============================================================
# - PLINK's version required extra investigation: it does not appear in
#   `conda list -n yeast-id` despite the reconstruction-branch script
#   (10_make_plink_and_popfile.sh) hardcoding `conda activate yeast-id`.
#   Shell history showed the actual successful run was live-patched with
#   `sed` to use `popgen` instead, and PLINK's version banner was directly
#   confirmed from that run's job log (plink_9711303.out). If re-running
#   10_make_plink_and_popfile.sh verbatim in yeast-id, it will fail with
#   "plink: command not found" - use popgen instead, or update the script.
